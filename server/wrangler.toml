name = "arena-leaderboard"
main = "worker.js"
compatibility_date = "2025-01-01"

# Create the database with:  npx wrangler d1 create arena-leaderboard
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "arena-leaderboard"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"
